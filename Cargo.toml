[workspace]
resolver = "2"
members = ["crates/browser-core", "crates/browser-client", "native-host"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2.2"
uuid = { version = "1", features = ["v4"] }
